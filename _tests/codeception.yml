suites:
    unit:
        path: unit
        actor: UnitTester
        modules:
            enabled:
                - Asserts
        step_decorators: ~
    integration:
        actor: IntegrationTester
        suite_namespace: \Integration
        modules:
            enabled:
                - Asserts
                - \Helper\Integration
    acceptance:
        actor: AcceptanceTester
        modules:
            enabled:
                - Asserts
                - \Helper\Acceptance
                - PhpBrowser:
                      url: http://localhost:8881
                      timeout: 120
settings:
    lint: true
bootstrap: _bootstrap.php
paths:
    tests: .
    output: _output
    support: _support
    data: .

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Register recovery regressions</title>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/post-recovery.css">
<link rel="stylesheet" href="/recovery-fixture.css">
<main id="content"><div class="live-post-feed"></div></main>
<div id="post-editor-resources" hidden>
    <template class="post-editor-context-menu-template">
        <div class="post-editor-context-menu">
            <div class="post-editor-context-main">
                <button type="button" data-context-ai-action="title">Suggest title</button>
                <button type="button" data-context-ai-action="tags">Suggest tags</button>
            </div>
            <div class="post-editor-link-panel" hidden>
                <input data-context-link-input>
                <p class="post-editor-link-error" hidden></p>
                <button type="button" data-context-action="remove-link">Remove link</button>
            </div>
            <div class="post-editor-image-panel" hidden>
                <button type="button" data-context-action="open-link">Link</button>
                <button type="button" data-context-action="edit-image-caption">Caption</button>
                <input data-context-image-alt-input>
            </div>
        </div>
    </template>
    <template class="post-image-caption-toolbar-template">
        <div class="post-media-caption-toolbar" contenteditable="false">
            <button data-caption-action="commit">Commit</button>
            <button data-caption-action="cancel">Cancel</button>
            <button data-caption-font="serif">Serif</button>
            <button data-caption-background="light">Light</button>
        </div>
    </template>
    <template class="post-recovery-discard-template">
        <div class="post-media-conflict-backdrop post-recovery-discard-backdrop">
            <section class="post-media-conflict-dialog post-recovery-discard-dialog" role="dialog" aria-modal="true" aria-label="Delete local copy">
                <header><span>Editor</span><h2>Delete local copy</h2><p>Delete this unsaved local copy?</p></header>
                <div class="post-media-conflict-actions post-recovery-discard-actions">
                    <button type="button" class="is-danger" data-recovery-discard-action="confirm">Delete local copy</button>
                    <button type="button" class="is-primary" data-recovery-discard-action="cancel">Keep local copy</button>
                </div>
            </section>
        </div>
    </template>
    <template class="post-discard-changes-template">
        <div class="post-media-conflict-backdrop post-discard-changes-backdrop">
            <section class="post-media-conflict-dialog post-discard-changes-dialog" role="dialog" aria-modal="true" aria-label="Discard unsaved changes">
                <header><span>Editor</span><h2>Discard unsaved changes</h2><p>Discard unsaved changes?</p></header>
                <div class="post-media-conflict-actions post-discard-changes-actions">
                    <button type="button" class="is-danger" data-discard-changes-action="discard">Discard changes</button>
                    <button type="button" class="is-primary" data-discard-changes-action="continue">Continue editing</button>
                </div>
            </section>
        </div>
    </template>
</div>
<script src="/recovery-fixture.js"></script>
<script src="/_assets/register/editor/storage.js"></script>
<script src="/_assets/register/editor/request.js"></script>
<script src="/post-recovery.js"></script>
<script src="/local-time.js"></script>
<script src="/_assets/register/editor/fields.js"></script>
<script src="/_assets/register/editor/boundaries.js"></script>
<script src="/_assets/register/editor/history.js"></script>
<script src="/_assets/register/editor/tags.js"></script>
<script src="/_assets/register/editor/recovery.js"></script>
<script src="/editor.js"></script>
</html>

<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Скруглённые углы</title>
    <style>
        * { box-sizing: border-box; }
        body { background: white; color: black; font: 16px Arial, sans-serif; margin: 0; }
        .rounded {
            border: 1px solid black;
            border-radius: 1em;
            margin: 100px auto;
            max-width: 520px;
            padding: 24px;
            text-align: center;
            width: 50%;
        }
    </style>
</head>
<body>
    <div class="rounded"><p>Вот эти ребята!</p></div>
</body>
</html>

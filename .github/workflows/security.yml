name: Security analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: Semgrep CE
    runs-on: ubuntu-24.04
    container:
      image: 'semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Scan first-party source
        run: >-
          semgrep scan
          --config p/php
          --config p/security-audit
          --metrics=off
          --error
          --exclude _vendor
          --exclude _cache
          --exclude _pictures
          --exclude _tests
          --exclude tools/build-shared-hosting.php
          --exclude _admin/lib
          --exclude _assets/register/analytics/highstock.js
          --exclude _assets/register/math/vendor
          --exclude _assets/register/syntax-highlighting/vendor
          .

  dast-baseline:
    name: ZAP baseline
    if: ${{ vars.DAST_TARGET_URL != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require an HTTPS staging target
        env:
          DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL }}
        run: |
          case "$DAST_TARGET_URL" in
            https://*) ;;
            *) echo 'DAST_TARGET_URL must be an HTTPS URL.' >&2; exit 64 ;;
          esac
      - name: Run passive baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.DAST_TARGET_URL }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef'
          cmd_options: '-a -m 2 -T 5'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

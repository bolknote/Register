name: Security analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: Semgrep CE
    runs-on: ubuntu-24.04
    container:
      image: 'semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan first-party source
        run: >-
          semgrep scan
          --config p/php
          --config p/security-audit
          --metrics=off
          --error
          --exclude _vendor
          --exclude _cache
          --exclude _pictures
          --exclude _tests
          --exclude tools/build-shared-hosting.php
          --exclude tools/build-release.php
          --exclude _admin/lib
          --exclude _assets/register/analytics/highstock.js
          --exclude _assets/register/math/vendor
          --exclude _assets/register/syntax-highlighting/vendor
          .

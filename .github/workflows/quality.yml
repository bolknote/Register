name: Quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  editor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP for browser fixtures and end-to-end tests
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: dom, gd, mbstring, pdo_sqlite, sodium
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction
      - name: Install browser test dependencies
        working-directory: _tests/browser/editor
        run: npm ci
      - name: Install test browsers
        working-directory: _tests/browser/editor
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Editor regressions in ${{ matrix.browser }}
        working-directory: _tests/browser/editor
        run: npm test
        env:
          EDITOR_TEST_BROWSER: ${{ matrix.browser }}
      - name: Install remaining end-to-end browsers
        if: matrix.browser == 'chromium'
        working-directory: _tests/browser/editor
        run: npx playwright install --with-deps firefox webkit
      - name: Editor browser to PHP and SQLite round trips
        if: matrix.browser == 'chromium'
        working-directory: _tests/browser/editor
        run: npm run test:e2e
      - name: Upload editor server diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-e2e-diagnostics-${{ matrix.browser }}
          path: _tests/_output/editor-e2e-server.log
          if-no-files-found: ignore

  analyse:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: ast, dom, gd, mbstring, pdo_sqlite

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install non-PHP linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes apache2 shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Quality gate
        run: REGISTER_REQUIRE_APACHE_SECURITY_TEST=1 composer check

name: Quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  editor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        working-directory: _tests/browser/editor
        run: npm ci
      - name: Install test browsers
        working-directory: _tests/browser/editor
        run: npx playwright install --with-deps chromium firefox
      - name: Editor regressions in Chromium and Firefox
        working-directory: _tests/browser/editor
        run: npm test

  analyse:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: ast, dom, gd, mbstring, pdo_sqlite

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install non-PHP linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes apache2 shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Quality gate
        run: REGISTER_REQUIRE_APACHE_SECURITY_TEST=1 composer check

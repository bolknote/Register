name: Test on SQLite

on: [ push ]

permissions:
  contents: read

env:
  APP_DB_TYPE: sqlite

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        operating_system: ['ubuntu-24.04']
        php_versions:
          - '8.3'
          - '8.4'
          - '8.5'
    runs-on: '${{ matrix.operating_system }}'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'SQLite version'
        run: |
          sqlite3 -version
          php -r 'echo "SQLite version: " . SQLite3::version()["versionString"] . PHP_EOL;'

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php_versions }}

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist --no-interaction

      - name: Run acceptance test cases
        run: ./bin/test-acceptance

      - name: Run integration test cases
        run: composer test:integration

      - name: Output logs
        if: failure()
        run: |
          find _cache/test _tests/_output/email -maxdepth 1 -type f -print -exec cat {} \;
          find _tests/_output -maxdepth 1 -type f -print

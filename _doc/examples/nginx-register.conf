# Include inside a `server` block after replacing the root and FastCGI socket.
root /home/account/register;
index index.php;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

client_max_body_size 210m;

# Reviewed PHP entrypoints. Keep these before the generic active-file denial.
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
location ~ ^/_admin/(?:ajax|index|install|pictman)\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# Two exact static files are required by AdminYard; the rest of Composer vendor
# remains private.
location = /_vendor/s2/admin-yard/demo/style.css {
    try_files $uri =404;
}
location = /_vendor/s2/admin-yard/demo/script.js {
    try_files $uri =404;
}
location ~ ^/_vendor/ {
    return 404;
}

# Public generated bundles are top-level, typed, and carry a hexadecimal build
# key. Metadata and nested cache directories are private.
location ~* ^/_cache/[a-z0-9_-]+\.[0-9a-f]+\.(?:css|js)(?:\.gz)?$ {
    try_files $uri =404;
}
location ~ ^/_cache/ {
    return 404;
}

# Implementation and operator data never leave the server.
location ~ ^/(?:_doc|_include|_tests|tools|\.codex|\.git|\.github|\.local)(?:/|$) {
    return 404;
}
location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}

# Deny direct execution/source delivery outside the reviewed controllers.
location ~* \.(?:asp|aspx|cgi|inc|jsp|phar|php[0-9]?|pht|phtml|pl|py|sh|shtml)$ {
    return 404;
}

# Public static namespaces. Active files above are rejected before these.
location /_admin/     { try_files $uri =404; }
location /_assets/    { try_files $uri =404; }
location /_extensions/ { try_files $uri =404; }
location /_pictures/  { try_files $uri =404; }
location /_styles/    { try_files $uri =404; }

# Conventional optional root metadata may be physical or application-generated.
location = /robots.txt      { try_files $uri @register; }
location = /favicon.ico     { try_files $uri @register; }
location = /site.webmanifest { try_files $uri @register; }

# Existing unrecognised root files are deliberately not served. All content
# routes go to the single public front controller.
location / {
    if (-f $request_filename) { return 404; }
    try_files __register_missing__ @register;
}

location @register {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
